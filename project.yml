name: RomandieWidget
options:
  bundleIdPrefix: ch.leromandie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Renseigne ton Team ID Apple ici (ou choisis-le dans Xcode > Signing).
    DEVELOPMENT_TEAM: ""

targets:
  # --- Application hôte (minimale, mais affiche aussi la liste des concerts) ---
  RomandieApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        # ⚠️ L'extension DOIT être ce même id + ".widget" (voir plus bas). Ne change
        #    pas le bundle id dans l'UI Xcode : modifie-le ici puis `xcodegen generate`.
        PRODUCT_BUNDLE_IDENTIFIER: ch.diane.romandie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: RomandieWidgetExtension

  # --- Extension widget (WidgetKit) ---
  RomandieWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        # = bundle id de l'app + ".widget" (préfixe obligatoire pour une extension).
        PRODUCT_BUNDLE_IDENTIFIER: ch.diane.romandie.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
