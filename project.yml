name: RomandieWidget
options:
  bundleIdPrefix: ch.leromandie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Renseigne ton Team ID Apple ici (ou choisis-le dans Xcode > Signing).
    DEVELOPMENT_TEAM: ""
    # >>> CHANGE UNIQUEMENT CETTE LIGNE pour ton identifiant unique. <<<
    # L'extension widget devient automatiquement APP_BUNDLE_ID + ".widget",
    # donc les deux restent toujours préfixés correctement.
    APP_BUNDLE_ID: ch.diane.romandie

targets:
  # --- Application hôte (minimale, mais affiche aussi la liste des concerts) ---
  RomandieApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Romandie
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Pour ajouter un concert du Romandie à ton calendrier."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: RomandieWidgetExtension

  # --- Extension widget (WidgetKit) ---
  RomandieWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
